<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road map for Legal Engineering</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f8fc;--cd:#fff;--tx:#14213d;--mu:#5b6b85;--ac:#0f2c59;--ln:#d9e0ec;--ok:#1a7f4b;--wr:#9a3412}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--cd:#17213a;--tx:#e8eefb;--mu:#9aabc7;--ac:#7fb0ff;--ln:#2a3858;--ok:#4cd08a;--wr:#fdba74}}
:root[data-theme="dark"]{--bg:#0e1524;--cd:#17213a;--tx:#e8eefb;--mu:#9aabc7;--ac:#7fb0ff;--ln:#2a3858;--ok:#4cd08a;--wr:#fdba74}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
main{max-width:720px;margin:0 auto;padding:14px 0 30px}
h1{font-size:23px;margin:4px 0;color:var(--ac);text-align:center}
.sub{color:var(--mu);font-size:14px;text-align:center;margin:0 0 12px}
.lang{display:flex;gap:8px;justify-content:center;margin:8px 0}
.lang button{border:1px solid var(--ln);background:var(--cd);color:var(--tx);padding:6px 14px;border-radius:20px;cursor:pointer}
.lang button.on{background:var(--ac);color:var(--bg)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:0 0 14px}
.card h2{font-size:17px;margin:0 0 4px;color:var(--ac)}
.gl{margin:6px 0;font-size:14px}.gl b{color:var(--ac)}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.pc{font-size:13px;color:var(--mu);text-align:right;margin:2px 0 12px}
.tl{border-left:3px solid var(--ln);margin-left:14px;padding-left:16px}
.st{position:relative}
.st:before{content:attr(data-n);position:absolute;left:-36px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.st.done:before{background:var(--ok)}
.tm{font-size:12px;color:var(--mu);margin-bottom:6px}
.goal{background:var(--bg);border-left:3px solid var(--ac);padding:8px 10px;border-radius:6px;margin:6px 0;font-size:15px}
details{border-top:1px solid var(--ln);padding:8px 0}
summary{cursor:pointer;font-weight:600;color:var(--ac);font-size:15px}
details ul,details ol{margin:6px 0 2px 18px;padding:0;font-size:15px}
details li{margin-bottom:6px}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow-x:auto;font-size:13px;line-height:1.45}
.er li::marker{color:var(--wr)}
.rs a{display:block;margin:6px 0;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;font-size:14px;color:var(--ac);text-decoration:none}
.rs a span{display:block;color:var(--mu);font-size:12px}
label.ck{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:var(--mu);cursor:pointer}
.ft{font-size:12px;color:var(--mu);text-align:center}
a.more{display:inline-block;margin:6px 0;color:var(--ac);font-weight:600;font-size:14px;text-decoration:none}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.nav a,.nav button{border:1px solid var(--ln);background:var(--cd);color:var(--ac);padding:7px 14px;border-radius:20px;font-size:14px;text-decoration:none;cursor:pointer}
@media print{:root{--bg:#fff;--cd:#fff;--tx:#000;--mu:#444;--ac:#0f2c59;--ln:#bbb}
.lang,.nav,.ck,.bar,.pc,a.more{display:none!important}.card{break-inside:avoid;border:1px solid #ccc}.tl{border:0;margin:0;padding:0}.st:before{display:none}body{font-size:12px}}
</style>
</head>
<body>

<div class="lang" id="lg"></div>
<div id="intro"></div>
<div class="bar"><i id="b"></i></div><div class="pc" id="pc"></div>
<div class="tl" id="tl"></div>
<div class="ft" id="ft"></div>
</main>
<script src="roadmap-ru.js"></script>
<script src="roadmap-en.js"></script>

st:[

ex:["Bitta oddiy jarayonni tanlang, masalan “NDA ni tasdiqlash”.","Uni qog‘ozga chizing: kim so‘raydi, kim o‘qiydi, kim imzolaydi.","Qayerda kutish yoki takror ish bor? Aynan shu joylar avtomatlashtirish nuqtalaridir."],
er:["Darhol kod yozishga shoshilish. Muammoni bilmasangiz, dastur keraksiz bo‘ladi.","Faqat texnologiyani o‘rganib, yuristlar bilan gaplashmaslik."],
ok:["Legal engineer nima qilishini 3 jumlada tushuntira olasiz","Bitta jarayonni chizib, kamida 2 ta kechikish joyini topgansiz"],

{t:"Huquqiy asos",g:"Avtomatlashtirishdan oldin shartnoma qanday tuzilishini va qayeri xavfli bo‘lishini tushunish.",
w:["1–3-hafta: Fuqarolik kodeksining majburiyatlar va shartnoma qismi. Har kuni 1 bob o‘qing, oxirida 5 qatorlik xulosa yozing.","4–6-hafta: shartnoma tuzilishi: taraflar, predmet, narx, muddat, javobgarlik, nizolar, rekvizitlar. 10 ta real shartnomani shu qismlarga bo‘lib chiqing.","7–10-hafta: xavfli bandlar: bir tomonlama bekor qilish, haddan katta penya, noaniq muddat, nizo ko‘riladigan joy, avtomatik uzaytirish.","11–14-hafta: Lex.uz da qidirish, hujjat o‘zgarishlari tarixini ko‘rish, shaxsiy ma’lumotlar to‘g‘risidagi qonun bilan tanishish."],

{t:"Dasturlash asoslari",g:"Shartnoma matnini o‘qiydigan, ma’lumot topadigan va saqlaydigan dastur yozishni o‘rganish.",
w:["1–3-hafta: Python: o‘zgaruvchi, ro‘yxat, lug‘at, sikl, funksiya. Har kuni 1 ta kichik masala yeching.","4–5-hafta: fayllar: DOCX o‘qish (python-docx), PDF o‘qish (pdfplumber).","6–8-hafta: regex: 9 xonali INN, sana, summa. regex101.com da mashq qiling.","9–10-hafta: SQLite (jadval yaratish, yozish, qidirish) va Git/GitHub (commit, push).","11–12-hafta: pastdagi mini-loyihani tugating."],

code:"import re, docx\n\nd = docx.Document('shartnoma.docx')\nmatn = '\\n'.join(p.text for p in d.paragraphs)\n\ninn = re.findall(r'\\b\\d{9}\\b', matn)\nsana = re.findall(r'\\d{2}\\.\\d{2}\\.\\d{4}', matn)\nprint('INN:', inn)\nprint('Sanalar:', sana)",
er:["Hamma narsani yodlashga urinish. Hujjatdan qidirib ishlatish normal.","Video ko‘rib, o‘zi yozmaslik. Har darsdan keyin kodni qayta yozing."],
ok:["50 qatorli dasturni noldan yoza olasiz","Regex bilan INN va sanani topasiz","SQLite ga yozib, qaytib o‘qiy olasiz"],
r:[["CS50 Python","https://cs50.harvard.edu/python/","Bepul, tushunarli Python kursi"],["SQLBolt","https://sqlbolt.com/","Interaktiv SQL mashqlari"],["regex101","https://regex101.com/","Regex ni jonli sinab ko‘rish"]]},
{t:"Hujjat va jarayonlarni avtomatlashtirish",g:"Shablondan tayyor hujjat yaratish va ish oqimini (tasdiqlash, eslatma) qurish.",
w:["1–2-hafta: shablon: shartnomadagi o‘zgaruvchi joylarni {{nom}}, {{summa}}, {{sana}} deb belgilang.","3–4-hafta: python-docx bilan shablondan Word fayl yarating (sizning bot ham shunday qiladi).","5–6-hafta: savolnoma → hujjat: foydalanuvchi savollarga javob beradi, dastur hujjat tayyorlaydi (docassemble yoki Telegram bot).","7–10-hafta: ish oqimi: tasdiqlash bosqichlari, muddat eslatmalari, n8n yoki Zapier bilan ulash."],
ex:["“Mehnat shartnomasi generatori”: bot 6 ta savol so‘raydi (ism, lavozim, maosh, boshlanish sanasi, sinov muddati, ish vaqti).","Dastur javoblarni shablonga qo‘yib, Word fayl yuboradi.","Qo‘shimcha: sinov muddati yo‘q bo‘lsa, shu band hujjatdan chiqib ketadi (shartli blok)."],
er:["Yurist ko‘rmagan shablonni ishlatish.","Har holat uchun alohida shablon yaratish. Buning o‘rniga shartli bloklardan foydalaning."],
ok:["Savollar asosida hujjat yaratadigan bot qurgansiz","Shablonda shartli blok ishlata olasiz","Jarayonda qayerda eslatma kerakligini aniqlay olasiz"],
r:[["docassemble","https://docassemble.org/","Savolnomadan hujjat yaratuvchi ochiq tizim"],["python-docx","https://python-docx.readthedocs.io/","Word fayllarni dasturda yaratish"],["n8n","https://n8n.io/","Jarayonlarni kodsiz ulash vositasi"]]},
{t:"AI va matn tahlili",g:"Til modellari yordamida shartnomani tahlil qilish va natijani ishonchli qilish.",

ex:["“Ishonchli taraflar ajratuvchisi”: model taraflar nomi, INN va manzilini JSON qilib beradi.","Dastur har bir qiymat shartnoma matnida bor-yo‘qligini tekshiradi.","Topilmasa [tekshiring] belgisi qo‘yiladi. Botingizdagi build_parties aynan shu g‘oya."],
code:"qiymat = taraf['inn']\nif qiymat and qiymat not in matn:\n    taraf['inn'] += ' [tekshiring]'",

ex:["“Legal AI Agent” loyihangizni case study qilib yozing.","Tuzilishi: muammo (yurist 1 shartnomaga 1 soat sarflaydi), yechim (bot), natija (3 daqiqa), cheklov (yurist tekshiruvi shart).","Cheklovlarni ochiq yozish sizga ishonchni oshiradi."],

Object.assign(D,window.RM||{});
const UI={uz:{more:"Bosqich sahifasini ochish",back:"← Barcha bosqichlar",pdf:"📄 PDF sifatida saqlash"},ru:{more:"Открыть страницу этапа",back:"← Все этапы",pdf:"📄 Сохранить как PDF"},en:{more:"Open stage page",back:"← All stages",pdf:"📄 Save as PDF"}};
const LN={uz:"O‘zbekcha",ru:"Русский",en:"English"};
const $=id=>document.getElementById(id);
const li=a=>a.map(x=>`<li>${x}</li>`).join("");
let lang="uz",done={};
try{lang=localStorage.getItem("rm_lang")||"uz";done=JSON.parse(localStorage.getItem("rm_done")||"{}")}catch(e){}
if(!D[lang])lang="uz";
function save(){try{localStorage.setItem("rm_lang",lang);localStorage.setItem("rm_done",JSON.stringify(done))}catch(e){}}
function render(){
const d=D[lang];document.documentElement.lang=lang;document.title=d.h;
$("h").textContent="⚖️ "+d.h;$("s").textContent=d.s;$("ft").textContent=d.ft;
$("lg").innerHTML=Object.keys(D).length>1?Object.keys(D).map(k=>`<button class="${k===lang?"on":""}" data-l="${k}">${LN[k]}</button>`).join(""):"";
const U=UI[lang],H=(location.hash.match(/^#s([1-6])$/)||[])[1];
const nav=`<div class="nav">${H?`<a href="#">${U.back}</a>`:""}<button onclick="window.print()">${U.pdf}</button></div>`;
$("intro").innerHTML=nav+(H?"":`<div class="card"><h2>${d.introT}</h2><p>${d.intro}</p>${d.gl.map(g=>`<div class="gl"><b>${g[0]}:</b> ${g[1]}</div>`).join("")}</div>`);
$("tl").innerHTML=d.st.map((s,i)=>{if(H&&+H!==i+1)return "";const x=SH[i];
return `<section class="card st${done[i]?" done":""}" data-n="${i+1}"><h2>${x.i} ${s.t}</h2><div class="tm">⏱ ${x.m}</div><div class="goal">🎯 ${s.g}</div>${H?"":`<a class="more" href="#s${i+1}">${U.more} →</a>`}
<details open><summary>${d.lblW}</summary><ul>${li(s.w)}</ul></details>
<details${H?" open":""}><summary>${d.lblE}</summary><ol>${li(s.ex)}</ol>${s.code?`<pre>${s.code.replace(/</g,"&lt;")}</pre>`:""}</details>
<details${H?" open":""}><summary>${d.lblX}</summary><ul class="er">${li(s.er)}</ul></details>
<details${H?" open":""}><summary>${d.lblO}</summary><ul>${li(s.ok)}</ul></details>
<details${H?" open":""}><summary>${d.lblR}</summary><div class="rs">${s.r.map(r=>`<a href="${r[1]}" target="_blank" rel="noopener">${r[0]} ↗<span>${r[2]}</span></a>`).join("")}</div></details>
<label class="ck"><input type="checkbox" data-i="${i}" ${done[i]?"checked":""}> ${d.ck}</label></section>`}).join("");
const n=Object.values(done).filter(Boolean).length,p=Math.round(n*100/d.st.length);
$("b").style.width=p+"%";$("pc").textContent=n+"/"+d.st.length+" · "+p+"%";}
document.addEventListener("click",e=>{const l=e.target.dataset&&e.target.dataset.l;if(l){lang=l;save();render()}});
document.addEventListener("change",e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!==undefined){done[i]=e.target.checked;save();render()}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
window.onbeforeprint=()=>document.querySelectorAll("details").forEach(x=>x.open=true);
render();
</script>
